# Render Blueprint: the five test shops, the settlement agent and the dashboard.
# Render → New → Blueprint → pick this repo and branch. See docs/TEST-SHOPS.md.
#
# Real Hedera testnet payments: the settlement agent checks every payment on the
# Mirror Node and writes HCS receipts. 0G, ENS and RazorpayX stay mocked.
# Set OPERATOR_PRIVATE_KEY by hand in Render (sangam-settlement → Environment).

envVarGroups:
  - name: sangam-shared
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: SETTLEMENT_SHARED_SECRET # same random value for the shops and the agent
        generateValue: true
      - key: ENS_OFFLINE # read merchants from MERCHANTS_FILE instead of ENS
        value: "true"
      - key: MERCHANTS_FILE # the shops' public URLs and the treasury payTo
        value: data/merchants.render.json

services:
  - type: web
    name: sangam-settlement
    runtime: node
    plan: free
    buildCommand: npm ci
    startCommand: npm run settlement
    envVars:
      - fromGroup: sangam-shared
      - key: SKIP_CHAIN_VERIFY # check every payment on the Hedera Mirror Node
        value: "false"
      - key: OPERATOR_ACCOUNT_ID # pays for HCS receipts (the treasury account)
        value: "0.0.11227653"
      - key: OPERATOR_PRIVATE_KEY # secret: paste it in Render, never commit it
        sync: false
      - key: HCS_TOPIC_ID # receipts topic
        value: "0.0.11262562"
      - key: SIGNUP_ENABLED # POST /signup opens testnet accounts for sangam-mcp users
        value: "true"
      - key: OG_MOCK
        value: "true"
      - key: PSP_MODE
        value: mock
      - key: DEMO_STEP_DELAY_MS
        value: "800"
      - key: MERCHANT_ENS_NAME # the shop the dashboard's simulate buttons pay
        value: rail.sangam.eth

  - type: web
    name: sangam-shops
    runtime: node
    plan: free
    buildCommand: npm ci
    startCommand: npm run shops
    healthCheckPath: /health
    envVars:
      - fromGroup: sangam-shared
      - key: SETTLEMENT_AGENT_URL # https://<sangam-settlement URL>
        sync: false

  - type: web
    name: sangam-dashboard
    runtime: static
    buildCommand: npm ci && npm --workspace @sangam/dashboard run build
    staticPublishPath: apps/dashboard/dist
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: VITE_SETTLEMENT_URL # https://<sangam-settlement URL>
        sync: false
      - key: VITE_MERCHANT_URL # https://<sangam-shops URL>/rail
        sync: false
